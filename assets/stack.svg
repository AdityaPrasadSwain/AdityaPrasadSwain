<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <defs>
    <linearGradient id="stack-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="stack-card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="880" height="340" rx="16" fill="url(#stack-bg)"/>

  <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#6e84a3" font-weight="700" letter-spacing="3">TECHNOLOGY STACK &amp; CAPABILITIES</text>
  <rect x="60" y="48" width="100" height="1.8" rx="0.9" fill="#00d2ff"/>

  <!-- Card 1: Backend Architecture (with Vector Lightning Icon) -->
  <g transform="translate(60, 75)">
    <rect width="240" height="230" rx="14" fill="#0b1426" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <g transform="translate(20, 18)">
      <polygon points="7,0 0,9 6,9 5,16 13,6 7,6" fill="#00d2ff"/>
      <text x="18" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#00d2ff" font-weight="700" letter-spacing="1">BACKEND ARCHITECTURE</text>
    </g>
    <line x1="20" y1="44" x2="220" y2="44" stroke="#162747" stroke-width="0.8"/>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">Java &amp; Spring Boot</text>

      <rect x="0" y="40" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">Spring Data JPA &amp; REST APIs</text>

      <rect x="0" y="80" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">Spring Security &amp; JWT</text>

      <rect x="0" y="120" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">PostgreSQL Database</text>
    </g>
  </g>

  <!-- Card 2: Frontend Engineering (with Vector Code Icon) -->
  <g transform="translate(320, 75)">
    <rect width="240" height="230" rx="14" fill="#0b1426" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <g transform="translate(20, 18)">
      <path d="M 4 3 L 0 7 L 4 11 M 10 3 L 14 7 L 10 11 M 9 1 L 5 13" stroke="#58a6ff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <text x="20" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#58a6ff" font-weight="700" letter-spacing="1">FRONTEND ENGINEERING</text>
    </g>
    <line x1="20" y1="44" x2="220" y2="44" stroke="#162747" stroke-width="0.8"/>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">React &amp; Modern Hooks</text>

      <rect x="0" y="40" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">Vite Build Tooling</text>

      <rect x="0" y="80" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">JavaScript (ES6+)</text>

      <rect x="0" y="120" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">HTML5 &amp; Responsive CSS</text>
    </g>
  </g>

  <!-- Card 3: DevOps & Tooling (with Vector Gear/Tools Icon) -->
  <g transform="translate(580, 75)">
    <rect width="240" height="230" rx="14" fill="#0b1426" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <g transform="translate(20, 18)">
      <circle cx="7" cy="7" r="4.5" fill="none" stroke="#a371f7" stroke-width="1.4"/>
      <path d="M 7 1 L 7 3 M 7 11 L 7 13 M 1 7 L 3 7 M 11 7 L 13 7" stroke="#a371f7" stroke-width="1.4" stroke-linecap="round"/>
      <text x="20" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a371f7" font-weight="700" letter-spacing="1">DEVOPS &amp; TOOLING</text>
    </g>
    <line x1="20" y1="44" x2="220" y2="44" stroke="#162747" stroke-width="0.8"/>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">Git &amp; GitHub Version Control</text>

      <rect x="0" y="40" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">REST API Design &amp; Testing</text>

      <rect x="0" y="80" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">Postman API Collections</text>

      <rect x="0" y="120" width="200" height="32" rx="8" fill="#101e38" stroke="#247bff" stroke-width="0.6"/>
      <text x="14" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e1e7f0" font-weight="600">Maven Build Automation</text>
    </g>
  </g>
</svg>