<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <defs>
    <linearGradient id="about-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="about-card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#247bff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="880" height="340" rx="16" fill="url(#about-bg)"/>
  
  <g opacity="0.04">
    <pattern id="about-dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00d2ff"/>
    </pattern>
    <rect width="880" height="340" fill="url(#about-dots)"/>
  </g>

  <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#6e84a3" font-weight="700" letter-spacing="3">ABOUT ME &amp; ENGINEERING PHILOSOPHY</text>
  <rect x="60" y="48" width="80" height="1.8" rx="0.9" fill="#00d2ff"/>

  <text x="60" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" fill="#ffffff" font-weight="600">
    Java Full-Stack Developer based in Bhubaneswar, Odisha, India.
  </text>
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8ba2c4">
    Specialized in architecting robust Spring Boot backends, scalable REST APIs, and responsive React frontend systems.
  </text>
  <text x="60" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8ba2c4">
    Passionate about clean code architecture, database optimization, and high-impact software solutions.
  </text>

  <g transform="translate(60, 160)">
    <rect width="760" height="145" rx="14" fill="#0b1426" stroke="url(#about-card-border)" stroke-width="1.2"/>

    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" dur="14s" keyTimes="0;0.30;0.34;0.35;0.65;0.96;1" repeatCount="indefinite"/>
      <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#00d2ff" font-weight="700" letter-spacing="2">01 // CORE ENGINEERING</text>
      <text x="28" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#e1e7f0" font-weight="600">Enterprise Java Architecture &amp; Scalable REST APIs</text>
      <text x="28" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8ba2c4">Designing production-ready services with Spring Data JPA, Hibernate, JWT security &amp; PostgreSQL.</text>
      <text x="28" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8ba2c4">Seamless integration with modern React, Vite, and high-performance client state management.</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" dur="14s" keyTimes="0;0.32;0.35;0.65;0.68;0.98;1" repeatCount="indefinite"/>
      <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#58a6ff" font-weight="700" letter-spacing="2">02 // WORK ETHIC &amp; AGILITY</text>
      <text x="28" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#e1e7f0" font-weight="600">Clean Code, Continuous Delivery &amp; Problem Solving</text>
      <text x="28" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8ba2c4">Writing modular, maintainable code with thorough documentation and Git version workflows.</text>
      <text x="28" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8ba2c4">Bringing athletic discipline and strategic mindset from playing competitive Kabaddi.</text>
    </g>
  </g>
</svg>